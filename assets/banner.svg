<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Jinish Kathiriya, AI Engineer. Agentic systems and production integrations.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1538"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <rect width="1000" height="280" fill="url(#glowA)"/>
    <rect width="1000" height="280" fill="url(#glowB)"/>

    <!-- agent graph, right side -->
    <g stroke="url(#accent)" stroke-width="1.6" stroke-opacity="0.55" fill="none">
      <path d="M690 70 L790 120 L900 80"/>
      <path d="M790 120 L760 210 L880 200"/>
      <path d="M900 80 L880 200"/>
      <path d="M690 70 L760 210"/>
      <path d="M880 200 L950 150"/>
      <path d="M900 80 L950 150"/>
    </g>
    <path d="M690 70 L790 120 L900 80 L880 200" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 14" stroke-opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <g>
      <circle cx="690" cy="70" r="7" fill="#0b1020" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="790" cy="120" r="11" fill="#0b1020" stroke="#a78bfa" stroke-width="2.4">
        <animate attributeName="r" values="11;13.5;11" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="120" r="4" fill="#a78bfa"/>
      <circle cx="900" cy="80" r="8" fill="#0b1020" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="760" cy="210" r="7" fill="#0b1020" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="880" cy="200" r="9" fill="#0b1020" stroke="#22d3ee" stroke-width="2.2">
        <animate attributeName="r" values="9;11;9" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="950" cy="150" r="5" fill="#22d3ee"/>
    </g>

    <!-- text -->
    <text x="64" y="76" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#22d3ee">AI ENGINEER</text>
    <text x="62" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Jinish Kathiriya</text>
    <rect x="64" y="162" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#cbd5e1">Agentic systems and production integrations</text>
    <text x="64" y="236" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" letter-spacing="0.5">LangGraph  /  RAG  /  Tool-using agents  /  Surat, India</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="279" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
